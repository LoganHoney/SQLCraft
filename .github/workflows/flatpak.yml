name: Flatpak

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Check cargo-sources.json matches Cargo.lock
        run: |
          python3 flatpak/gen-cargo-sources.py Cargo.lock /tmp/cargo-sources.json
          diff -q /tmp/cargo-sources.json flatpak/cargo-sources.json
      - name: Build Flatpak
        run: |
          set -o pipefail
          # The image ships the 25.08 Platform and Sdk; updating them in place
          # fails ("Invalid cross-device link"), so only add the Rust and LLVM extensions.
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Sdk.Extension.rust-stable//25.08 org.freedesktop.Sdk.Extension.llvm21//25.08
          flatpak list --runtime --columns=application,branch,installation
          if ! flatpak-builder --repo=repo --disable-rofiles-fuse \
                --force-clean build-dir flatpak/io.github.loganhoney.SQLCraft.yml 2>&1 | tee build.log; then
            # Annotations are readable without signing in, unlike job logs, but
            # each holds 4 KB and a step gets 10, so post the tail in pieces.
            grep -v -e 'cargo:rerun-if' -e '^ *Compiling ' -e '^\[[0-9]*\] ' -e 'debuginfo' -e '^processing: ' -e '^stripping ' build.log \
              | tail -c 32000 | python3 -c "
          import sys
          t = sys.stdin.read()
          for i in range(0, len(t), 3800):
              part = t[i:i + 3800].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::error title=flatpak-builder log {i // 3800 + 1}::' + part)
          "
            exit 1
          fi
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo SQLCraft.flatpak io.github.loganhoney.SQLCraft
      - uses: actions/upload-artifact@v4
        with:
          name: SQLCraft.flatpak
          path: SQLCraft.flatpak
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SQLCraft.flatpak
          generate_release_notes: true

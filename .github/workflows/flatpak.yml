name: Flatpak

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Check cargo-sources.json matches Cargo.lock
        run: |
          python3 flatpak/gen-cargo-sources.py Cargo.lock /tmp/cargo-sources.json
          diff -q /tmp/cargo-sources.json flatpak/cargo-sources.json
      - name: Build Flatpak
        run: |
          set -o pipefail
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          if ! flatpak-builder --repo=repo --disable-rofiles-fuse --install-deps-from=flathub \
                --force-clean build-dir flatpak/io.github.loganhoney.SQLCraft.yml 2>&1 | tee build.log; then
            # Annotations are readable without signing in, unlike job logs.
            tail -n 150 build.log | python3 -c "import sys; t=sys.stdin.read()[-60000:]; print('::error title=flatpak-builder failed::' + t.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))"
            exit 1
          fi
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo SQLCraft.flatpak io.github.loganhoney.SQLCraft
      - uses: actions/upload-artifact@v4
        with:
          name: SQLCraft.flatpak
          path: SQLCraft.flatpak
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SQLCraft.flatpak
          generate_release_notes: true

[package]
name = "sqlstudio"
version = "0.1.0"
edition = "2024"
description = "SQL Server management studio for Linux"
license = "MIT"

[dependencies]
chrono = "0.4.45"
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "0.37.0", features = ["syntect"] }
futures-util = "0.3.34"
keyring = "4.2.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiberius = { version = "0.13.0", default-features = false, features = ["rustls", "tds80", "chrono", "sql-browser-tokio", "sspi-rs"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "fs", "net", "sync", "macros", "time"] }
tokio-util = { version = "0.7.20", features = ["compat"] }

[patch.crates-io]
# Upstream tiberius 0.13 with PRINT/info messages, row counts and USE changes
# surfaced through QueryStream::drain_events (see vendor/tiberius/PATCHED.md).
tiberius = { path = "vendor/tiberius" }

[profile.release]
lto = "thin"
strip = true

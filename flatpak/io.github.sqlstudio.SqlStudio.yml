app-id: io.github.sqlstudio.SqlStudio
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: sqlstudio
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Reach SQL Server over the network.
  - --share=network
  # Remember passwords in GNOME Keyring / KWallet via the Secret Service.
  - --talk-name=org.freedesktop.secrets
  # Files are opened and saved through the file chooser portal, so no
  # --filesystem access is needed.
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/sqlstudio/cargo
    CARGO_NET_OFFLINE: 'true'
modules:
  - name: sqlstudio
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 target/release/sqlstudio /app/bin/sqlstudio
      - install -Dm644 flatpak/io.github.sqlstudio.SqlStudio.desktop /app/share/applications/io.github.sqlstudio.SqlStudio.desktop
      - install -Dm644 flatpak/io.github.sqlstudio.SqlStudio.metainfo.xml /app/share/metainfo/io.github.sqlstudio.SqlStudio.metainfo.xml
      - install -Dm644 flatpak/io.github.sqlstudio.SqlStudio.svg /app/share/icons/hicolor/scalable/apps/io.github.sqlstudio.SqlStudio.svg
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - .git
          - .flatpak-builder
          - flatpak/build-dir
          - flatpak/repo
          - flatpak/.flatpak-builder
          - '*.flatpak'
      - cargo-sources.json
